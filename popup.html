<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  header img {
    width: 22px;
    height: 22px;
  }
  h1 {
    font-size: 14px;
    margin: 0;
  }
  button {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #555;
    min-height: 16px;
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>FullPage Shot</h1>
  </header>
  <button id="captureBtn">Capture Full Page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
